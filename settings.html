<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BankDash</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            font-family: "Inter", sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">

    <!-- Sidebar -->
    <aside id="sidebar"
        class="bg-white w-64 min-h-screen fixed top-0 left-0 transform transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 border-gray-200 flex flex-col z-40">
        <div class="flex items-center justify-center p-4 border-b border-gray-200">
            <img src="img/logo.png" alt="BankDash Logo" class="w-9 h-9 mr-2">
            <h1 class="text-2xl font-bold text-gray-800">BankDash.</h1>
        </div>
        <nav class="flex flex-col p-2 space-y-2">
            <a href="#"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/dasboard.svg" alt="Dashboard Icon" class="w-5 h-5 mr-3">Dashboard
            </a>
            <a href="#"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/transactions.svg" alt="Transactions Icon" class="w-5 h-5 mr-3">Transactions
            </a>
            <a href="#"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/accounts.svg" alt="Accounts Icon" class="w-5 h-5 mr-3">Accounts
            </a>
            <a href="#"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/investments.svg" alt="Investments Icon" class="w-5 h-5 mr-3">Investments
            </a>
            <a href="Credit-Cards.html"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/credit-card.svg" alt="Credit Cards Icon" class="w-5 h-5 mr-3">Credit Cards
            </a>
            <a href="#"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/loans.svg" alt="Loans Icon" class="w-5 h-5 mr-3">Loans
            </a>
            <a href="services.html"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/service 1.svg" alt="Services Icon" class="w-5 h-5 mr-3">Services
            </a>
            <a href="#"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/privileges.svg" alt="My Privileges Icon" class="w-5 h-5 mr-3">My Privileges
            </a>
            <a href="settings.html"
                class="flex items-center text-gray-700 hover:text-blue-600 hover:bg-gray-100 active:bg-gray-200 focus:bg-gray-200 hover:shadow-md hover:translate-x-1 transition-all duration-200 p-3 rounded-lg">
                <img src="img/icon/settings 1.svg" alt="Settings Icon" class="w-5 h-5 mr-3">Settings
            </a>
        </nav>
    </aside>

    <!-- Main Layout -->
    <div class="flex flex-col md:flex-row min-h-screen overflow-hidden pt-6">
        <main class="flex-1 md:ml-64 pt-16 md:mt-0">
            <!-- Mobile menu button -->
            <button id="menu-button" class="fixed top-4 left-4 z-50 md:hidden bg-white p-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-800" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <!-- Header -->
            <header
                class="fixed top-0 left-0 right-0 bg-white shadow p-4 z-30 md:ml-64 flex flex-col item-center justify-between px-10">
                <!-- title, profile -->
                <div class="flex items-center justify-between md:justify-between w-full">
                    <!-- <button id="menu-button" class="absolute top-4 left-4 md:hidden z-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-800" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button> -->
                    <div class="text-center flex-1 md:flex-none md:text-left">
                        <a href="#" class="text-[#343C6A] font-semibold text-[25px] block">Setting</a>
                    </div>

                    <div class="md:hidden">
                        <img src="img/profile.png" alt="Profile" class="w-8 h-8 rounded-full" />
                    </div>

                    <!-- Desktop right icons -->
                    <nav class="hidden md:flex items-center gap-6">
                        <div class="relative">
                            <input type="text" placeholder="Search for something"
                                class="pl-10 pr-4 py-2 rounded-full focus:outline-none focus:ring focus:border-blue-300"
                                style="background-color: #f5f7fa" />
                            <img src="img/icon/search.svg" alt="Search Icon"
                                class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                        </div>
                        <div class="p-2 rounded-full cursor-pointer" style="background-color: #f5f7fa">
                            <img src="img/icon/settings.svg" alt="Settings" class="w-6 h-6" />
                        </div>
                        <div class="p-2 rounded-full cursor-pointer" style="background-color: #f5f7fa">
                            <img src="img/icon/002-notification-1.svg" alt="Notifications" class="w-6 h-6" />
                        </div>
                        <img src="img/profile.png" alt="Profile" class="w-8 h-8 rounded-full" />
                    </nav>
                </div>

                <!-- Search bar for mobile -->
                <div class="mt-2 md:hidden">
                    <div class="relative">
                        <input type="text" placeholder="Search for something"
                            class="pl-10 pr-4 py-2 rounded-full focus:outline-none focus:ring focus:border-blue-300 w-full"
                            style="background-color: #f5f7fa" />
                        <img src="img/icon/search.svg" alt="Search Icon"
                            class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400" />
                    </div>
                </div>
            </header>

            <!-- content: Settings -->
            <div class="p-7 overflow-auto px-10">
                <div class="mb-4">
                    <div class="flex space-x-4 overflow-x-auto space-x-3 items-start w-full">
                        <div class="bg-white rounded-2xl shadow-md p-6 w-full">
                            <div class="flex border-b border-gray-200 mb-6">
                                <a href="settings.html"
                                    class="py-2 px-4 text-blue-600 border-b-2 border-blue-600 font-semibold focus:outline-none">Edit
                                    Profile</a>
                                <a href="setting-preferences.html"
                                    class="py-2 px-4 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none">Preferences</a>
                                <a href="setting-security.html"
                                    class="py-2 px-4 text-gray-500 hover:text-blue-600 font-semibold focus:outline-none">Security</a>
                            </div>

                            <!-- Edit profile -->
                            <div class="flex flex-col md:flex-row gap-8">
                                <!-- Profile Image -->
                                <div class="flex flex-col items-center">
                                    <div class="relative w-32 h-32">
                                        <img src="img/profile.png" alt="Profile"
                                            class="w-32 h-32 rounded-full object-cover" />
                                        <div
                                            class="absolute bottom-0 right-0 bg-blue-600 p-1 rounded-full cursor-pointer">
                                            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                                                <path
                                                    d="M17.414 2.586a2 2 0 00-2.828 0L7 10.172V13h2.828l7.586-7.586a2 2 0 000-2.828z" />
                                                <path fill-rule="evenodd"
                                                    d="M2 15a1 1 0 001 1h12a1 1 0 001-1v-1h-2v1H4v-4h1v-2H4a1 1 0 00-1 1v5z"
                                                    clip-rule="evenodd" />
                                            </svg>
                                        </div>
                                    </div>
                                </div>

                                <!-- Form -->
                                <form class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
                                    <!-- Your Name -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Your Name</label>
                                        <input type="text" value="Charlene Reed"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- User Name -->
                                    <div>
                                        <label class="text-gray-600 text-sm">User Name</label>
                                        <input type="text" value="Charlene Reed"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Email -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Email</label>
                                        <input type="email" value="charlenereed@gmail.com"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Password -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Password</label>
                                        <input type="password" value="********"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Date of Birth -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Date of Birth</label>
                                        <input type="date" value=""
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Present Address -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Present Address</label>
                                        <input type="text" value="San Jose, California, USA"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Permanent Address -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Permanent Address</label>
                                        <input type="text" value="San Jose, California, USA"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- City -->
                                    <div>
                                        <label class="text-gray-600 text-sm">City</label>
                                        <input type="text" value="San Jose"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Postal Code -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Postal Code</label>
                                        <input type="text" value="45962"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>

                                    <!-- Country -->
                                    <div>
                                        <label class="text-gray-600 text-sm">Country</label>
                                        <input type="text" value="USA"
                                            class="w-full mt-2 p-3 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400 text-[#718EBF]" />
                                    </div>
                                </form>
                            </div>

                            <!-- Save Button -->
                            <div class="flex justify-end mt-6">
                                <button
                                    class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">
                                    Save
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const button = document.getElementById('menu-button');
        const sidebar = document.getElementById('sidebar');

        button.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });
    </script>
</body>

</html>
